<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le live du 27 novembre | BASS Trading</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bk:#1D1D1F;--g1:#6E6E73;--g4:#F5F5F7;--pure:#FFF}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;color:var(--bk);background:var(--pure);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
    .top{padding:22px 24px;border-bottom:1px solid var(--g4);text-align:center}
    .logo{font-family:'Outfit',sans-serif;font-weight:900;letter-spacing:6px;font-size:.95rem;text-decoration:none;color:inherit}
    main{flex:1;padding:56px 20px 72px}
    .inner{max-width:880px;margin:0 auto;text-align:center}
    h1{font-family:'Outfit',sans-serif;font-size:clamp(1.9rem,4vw,3rem);font-weight:900;line-height:1.08;letter-spacing:-1px;margin-bottom:16px}
    p{font-size:1.05rem;color:var(--g1);line-height:1.7;max-width:560px;margin:0 auto 24px}
    .video{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;background:var(--bk);margin-bottom:24px}
    .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .btn{display:inline-block;background:var(--bk);color:var(--pure);font-weight:700;padding:16px 28px;border-radius:12px;text-decoration:none}
    [hidden]{display:none}
  </style>
</head>
<body>
<header class="top"><a class="logo" href="/">BASS</a></header>
<main><div class="inner">
  <h1 id="titre">Le live, c'est vendredi 27 novembre à 20 h 30</h1>
  <p id="texte">Heure de Paris. Le direct s'affichera ici : garde cette page, et recharge-la à 20 h 30.</p>
  <div class="video" id="cadre" hidden></div>
  <a class="btn" id="lien" hidden>Ouvrir sur YouTube pour écrire dans le chat</a>
</div></main>
<script>
// Renseigner l'identifiant du direct YouTube dès qu'il est créé.
var VIDEO = '';
var DEBUT = Date.UTC(2026, 10, 27, 19, 15); // 20 h 15 à Paris : le lecteur s'affiche avant l'heure
var FIN = Date.UTC(2026, 10, 30, 23, 0);    // lundi 30/11 à minuit à Paris : fin du replay

function etat(maintenant, video) {
  if (maintenant >= FIN) return 'fini';
  if (maintenant >= DEBUT && video) return 'video';
  return 'attente';
}

var e = etat(Date.now(), VIDEO);
if (e === 'video') {
  document.getElementById('titre').textContent = 'On y est.';
  document.getElementById('texte').textContent = 'Le direct est juste en dessous. Pour le test, ouvre-le sur YouTube : c\'est là que tu écris dans le chat.';
  document.getElementById('cadre').hidden = false;
  document.getElementById('cadre').innerHTML = '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(VIDEO) + '" title="Le live" allowfullscreen></iframe>';
  var l = document.getElementById('lien');
  l.hidden = false;
  l.href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(VIDEO);
} else if (e === 'fini') {
  document.getElementById('titre').textContent = 'Le replay est terminé';
  document.getElementById('texte').textContent = 'Il était disponible jusqu\'au lundi 30 novembre.';
}
</script>
<script src="/v.js" defer></script>
</body>
</html>
