<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — Bass Trading</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#0A0A0A;--txt:#EDEDED;--mute:#9A9A9A;--gold:#C9A84C}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.6 system-ui,sans-serif}
main{max-width:440px;margin:100px auto;padding:0 16px;text-align:center}
a{color:var(--gold)}
</style>
</head>
<body>
<main id="m">Connexion en cours…</main>
<script>
(async () => {
  const t = new URLSearchParams(location.search).get("t");
  const m = document.getElementById("m");
  if (!t) { location.replace("/espace/"); return; }
  try {
    const r = await fetch("https://api.basstrading.fr/auth/session", {method: "POST", credentials: "include",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({t})});
    if (!r.ok) throw await r.json();
    let retour = "/espace/";
    try { const x = localStorage.getItem("bt_retour"); if (x && x.startsWith("/")) { retour = x; localStorage.removeItem("bt_retour"); } } catch {}
    location.replace(retour);
  } catch (e) {
    m.innerHTML = (e && e.detail ? e.detail : "Ce lien n'est plus valable.") + '<br><br><a href="/espace/">Recevoir un nouveau lien</a>';
  }
})();
</script>
</body>
</html>
