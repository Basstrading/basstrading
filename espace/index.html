<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon espace — Bass Trading</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Espace formation façon Kajabi (15/10/2026) : bibliothèque, page formation, lecteur avec sommaire, quiz, questions. */
:root{--bg:#0A0A0A;--panel:#111;--card:#151515;--line:#262626;--txt:#EDEDED;--mute:#9A9A9A;--gold:#C9A84C;--gold2:#E3C46A;--ok:#3FB37F;--err:#E5484D}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 'DM Sans',system-ui,sans-serif}
a{color:var(--gold);text-decoration:none}
button{font:inherit}
header{position:sticky;top:0;z-index:30;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .in{display:flex;align-items:center;gap:18px;max-width:1280px;margin:0 auto;padding:14px 20px}
header .logo{font:700 18px 'Outfit';letter-spacing:.04em;color:var(--txt)}
header .logo b{color:var(--gold)}
header nav{display:flex;gap:16px;margin-left:auto;align-items:center}
header nav a{color:var(--mute);font-size:15px}header nav a:hover,header nav a.on{color:var(--txt)}
header nav button{background:none;border:1px solid var(--line);color:var(--mute);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
main{max-width:1280px;margin:0 auto;padding:28px 20px 80px}
h1{font:700 32px/1.15 'Outfit';margin:0 0 8px}
h2{font:600 21px 'Outfit';margin:34px 0 14px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#111;border:0;border-radius:10px;padding:12px 20px;font:600 16px 'Outfit';cursor:pointer;text-decoration:none}
.btn:hover{background:var(--gold2)}.btn:disabled{opacity:.55;cursor:wait}
.btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn.sec:hover{border-color:var(--gold)}
.btn.ok{background:var(--ok);color:#fff}
.small{font-size:14px;color:var(--mute)}
.msg{margin-top:12px;color:var(--mute);font-size:15px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.login{max-width:440px;margin:60px auto}
.ou{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:18px 0}.ou:before,.ou:after{content:"";flex:1;height:1px;background:var(--line)}
.lien-btn{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
.btn.tg{background:#2AABEE;color:#fff;width:100%}.btn.tg:hover{background:#229ED9}
input[type=password],input.code{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0E0E0E;color:var(--txt);font:inherit;margin:12px 0}
input.code{font:700 28px 'Outfit';letter-spacing:10px;text-align:center}

input[type=email],textarea{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0E0E0E;color:var(--txt);font:inherit;margin:12px 0}
textarea{resize:vertical;min-height:90px}
.barre{height:6px;background:#242424;border-radius:9px;overflow:hidden}.barre i{display:block;height:100%;background:var(--gold);border-radius:9px}
/* couvertures générées */
.couv{position:relative;aspect-ratio:16/9;border-radius:12px 12px 0 0;overflow:hidden;display:flex;align-items:flex-end;padding:18px}
.couv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.7))}
.couv span{position:relative;z-index:1;font:700 22px/1.15 'Outfit';color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
/* bibliothèque */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.fo{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--txt);transition:transform .15s,border-color .15s}
.fo:hover{transform:translateY(-3px);border-color:#3a3a3a}
.fo .corps{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.fo .corps .bas{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.reprise{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;overflow:hidden;padding:0;margin-bottom:10px}
.reprise .couv{border-radius:0;aspect-ratio:auto;min-height:220px}
.reprise .txt{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px}
/* page formation */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:center;margin-bottom:10px}
.hero .couv{border-radius:14px}
.module{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--card);overflow:hidden}
.module summary{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;list-style:none;font:600 17px 'Outfit'}
.module summary::-webkit-details-marker{display:none}
.module summary .n{margin-left:auto;font:400 14px 'DM Sans';color:var(--mute)}
.module summary::before{content:"›";color:var(--gold);font-size:22px;transition:transform .15s}
.module[open] summary::before{transform:rotate(90deg)}
.lec{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);color:var(--txt)}
.lec:hover{background:#1b1b1b}
.coche{width:22px;height:22px;border-radius:50%;border:2px solid #3a3a3a;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#111}
.vue .coche{background:var(--ok);border-color:var(--ok);color:#fff}
.lec .ty{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap}
/* lecteur */
.lecteur{display:grid;grid-template-columns:330px minmax(0,1fr);gap:0;max-width:1440px;margin:0 auto;min-height:calc(100vh - 62px)}
.cote{border-right:1px solid var(--line);background:var(--panel);position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.cote .tete{padding:20px 18px;border-bottom:1px solid var(--line)}
.cote .tete a{color:var(--mute);font-size:14px}
.cote h3{font:600 17px/1.3 'Outfit';margin:8px 0 12px}
.cote .module{border:0;border-radius:0;margin:0;background:transparent;border-bottom:1px solid var(--line)}
.cote .module summary{font-size:15px;padding:14px 18px}
.cote .lec{padding:10px 18px 10px 22px;border-top:0;font-size:14px}
.cote .lec.ici{background:#1f1a0d;box-shadow:inset 3px 0 0 var(--gold)}
.cote .coche{width:18px;height:18px;font-size:10px}
.scene{padding:24px 32px 80px;min-width:0}
.ecran{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
.ecran video{width:100%;height:100%;display:block}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 6px}
.actions .esp{flex:1}
.onglets{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:26px 0 20px}
.onglets a{padding:12px 16px;color:var(--mute);font:500 16px 'Outfit';cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.onglets a.on{color:var(--txt);border-color:var(--gold)}
.desc{color:#d2d2d2}.desc img{max-width:100%}
.desc .embed{position:relative;aspect-ratio:16/9;margin:0 0 16px}.desc .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4)}
/* quiz */
.quiz .qst{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.quiz .qst h4{font:600 17px 'Outfit';margin:0 0 12px}
.quiz label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.quiz label:hover{border-color:#3a3a3a}
.quiz input{accent-color:var(--gold);margin-top:5px}
.quiz label.bon{border-color:var(--ok);background:rgba(63,179,127,.08)}.quiz label.faux{border-color:var(--err);background:rgba(229,72,77,.08)}
.quiz .expl{font-size:14px;color:var(--mute);margin-top:6px}
.resultat{border-radius:12px;padding:18px 20px;margin-bottom:18px;font:600 18px 'Outfit'}
.resultat.ok{background:rgba(63,179,127,.12);color:var(--ok)}.resultat.ko{background:rgba(229,72,77,.1);color:var(--err)}
/* questions */
.fil{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--card)}
.qq{display:flex;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:#2a2a2a;color:var(--txt);display:flex;align-items:center;justify-content:center;font:600 15px 'Outfit';flex:none}
.av.bass{background:var(--gold);color:#111}
.qq .nom{font-weight:600}.qq .nom .badge{background:var(--gold);color:#111;border-radius:6px;padding:1px 7px;font-size:12px;margin-left:6px}
.qq .t{white-space:pre-wrap;margin-top:4px}
.rep{margin:14px 0 0 48px;padding-top:14px;border-top:1px solid var(--line)}
.lien-mini{background:none;border:0;color:var(--mute);cursor:pointer;font-size:13px;padding:0;margin-right:12px}
.lien-mini:hover{color:var(--gold)}
.sommaire-mobile{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--txt)}
.stat b{display:block;font:700 22px 'Outfit'}.stat span{font-size:13px;color:var(--mute)}
a.stat:hover{border-color:var(--gold)}
.outils{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.outils .esp{flex:1}
.vit{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.vit.on{border-color:var(--gold);color:var(--gold)}
.gros-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;border:0;background:var(--gold);color:#111;font-size:34px;padding-left:8px;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.55);z-index:4;transition:transform .15s}
.gros-play:hover{transform:translate(-50%,-50%) scale(1.07);background:var(--gold2)}
.suite{position:absolute;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
.suite h3{font:600 24px 'Outfit';margin:6px 0 18px}
.row-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:34px 0 14px}
.recherche{flex:1;min-width:240px;max-width:460px;margin-left:auto;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:#0E0E0E;color:var(--txt);font:inherit}
mark{background:rgba(201,168,76,.35);color:inherit;border-radius:3px;padding:0 2px}
@media (max-width:960px){.raccourcis{display:none}}
@media (max-width:960px){
  .lecteur{grid-template-columns:minmax(0,1fr)}
  .cote{position:fixed;inset:62px 0 0 0;height:auto;z-index:25;transform:translateX(-100%);transition:transform .2s;width:min(360px,90vw)}
  .cote.ouvert{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .scene{padding:16px 16px 70px}
  .sommaire-mobile{display:inline-flex}
  .hero,.reprise{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="in"><a class="logo" href="#/">BASS <b>TRADING</b></a>
  <nav><a href="#/" id="nl">Mes formations</a><a href="#/compte" id="nc" hidden>Mon compte</a><a href="/studio/" id="ns" hidden>Studio</a><button id="out" hidden>Se déconnecter</button></nav></div></header>
<div id="app"><main><p class="sub">Chargement…</p></main></div>
<script>
const API = "https://api.basstrading.fr";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const quand = d => { const s = (Date.now() - new Date(d)) / 1000; if (s < 60) return "à l'instant"; if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`; if (s < 7 * 86400) return `il y a ${Math.floor(s / 86400)} j`; return new Date(d).toLocaleDateString("fr-FR"); };
const duree = s => s ? (s >= 3600 ? `${Math.floor(s / 3600)} h ${String(Math.round(s % 3600 / 60)).padStart(2, "0")}` : `${Math.max(1, Math.round(s / 60))} min`) : "";
async function api(path, opts = {}) {
  const r = await fetch(API + path, {credentials: "include", headers: {"Content-Type": "application/json"}, ...opts});
  if (r.status === 401) throw {auth: true};
  if (!r.ok) { let d = ""; try { d = (await r.json()).detail } catch {} throw {msg: d || "Erreur " + r.status}; }
  return r.json();
}
const post = (p, b) => api(p, {method: "POST", body: JSON.stringify(b || {})});
const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };
// Couverture générée à partir du nom de la formation (couleurs stables)
const COULEURS = [["#3a2a08", "#C9A84C"], ["#0b2a3a", "#2b8fc9"], ["#2a0b2a", "#b0489c"], ["#0b3a24", "#2fb37b"], ["#3a0b0b", "#d0573f"], ["#1b1b3a", "#6b6bd6"]];
const couv = (slug, titre, cls = "") => { let h = 0; for (const c of slug) h = (h * 31 + c.charCodeAt(0)) >>> 0; const [a, b] = COULEURS[h % COULEURS.length];
  return `<div class="couv ${cls}" style="background:radial-gradient(circle at 80% 10%, ${b}55, transparent 55%),linear-gradient(135deg, ${a}, #0b0b0b 75%)"><span>${esc(titre)}</span></div>`; };
const page = html => { app.innerHTML = `<main>${html}</main>`; };
const entete = moi => { document.getElementById("out").hidden = false; document.getElementById("nc").hidden = false; document.getElementById("ns").hidden = !(moi && moi.admin); };

/* ── Connexion : email → code à 6 chiffres ou mot de passe, création du mot de passe, Telegram ── */
let attenteTg = null;
const stopTg = () => { if (attenteTg) { clearInterval(attenteTg); attenteTg = null; } };
const BOUTON_TG = `<button class="btn tg" id="tg" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.8 15.2l-.4 5.2c.6 0 .8-.2 1.1-.5l2.7-2.6 5.6 4.1c1 .6 1.8.3 2-.9l3.7-17.2c.3-1.5-.6-2.1-1.6-1.7L1.2 9.8c-1.5.6-1.4 1.4-.3 1.7l5.6 1.7L19.6 5c.6-.4 1.2-.2.7.2z"/></svg>Se connecter avec Telegram</button>`;

function login(info) {
  stopTg();
  document.getElementById("out").hidden = true; document.getElementById("nc").hidden = true;
  page(`<div class="login card"><h1>Mon espace formation</h1>
    <p class="sub">Entre l'adresse email utilisée lors de ton achat ou de ton inscription.</p>
    <form id="f"><input type="email" id="e" required placeholder="ton@email.com" autocomplete="email" value="${esc(sessionStorage.getItem("bt_email") || "")}">
    <button class="btn" id="b" style="width:100%">Continuer</button></form>
    <div class="ou"><span>ou</span></div>${BOUTON_TG}
    <div class="msg" id="m">${esc(info || "")}</div></div>`);
  document.getElementById("tg").onclick = () => connexionTelegram(false);
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault(); const b = document.getElementById("b"), m = document.getElementById("m");
    const email = document.getElementById("e").value.trim();
    try { sessionStorage.setItem("bt_email", email); } catch {}
    b.disabled = true; m.className = "msg"; m.textContent = "Vérification…";
    try {
      const r = await post("/auth/code", {email, envoyer: false});
      if (!r.eleve) return pasEleve(email);
      if (r.a_mdp) return ecranMdp(email, r.prenom);
      await envoyerCode(email, r.prenom);
    } catch (x) { m.className = "msg err"; m.textContent = x.msg || "Réessaie dans une minute."; b.disabled = false; }
  };
}

function pasEleve(email) {
  page(`<div class="login card"><h1>Pas encore de formation</h1>
    <p class="sub">Aucune formation n'est liée à <b>${esc(email)}</b>.</p>
    <p class="sub">Tu as peut-être acheté avec une autre adresse : essaie-la. Sinon, commence par la formation offerte : accès immédiat.</p>
    <a class="btn" style="width:100%" href="/t/973c6e22/">🎁 Recevoir la formation offerte</a>
    <a class="btn sec" style="width:100%;margin-top:10px" href="/">Voir toutes les formations</a>
    <button class="btn sec" id="r" style="width:100%;margin-top:10px">Essayer une autre adresse</button>
    <p class="small" style="margin-top:16px">Tu es sûr d'avoir acheté avec cette adresse ? Écris à <a href="mailto:contact@basstrading.fr">contact@basstrading.fr</a>.</p></div>`);
  document.getElementById("r").onclick = () => login();
}

function ecranMdp(email, prenom) {
  page(`<div class="login card"><h1>${prenom ? "Re-bonjour " + esc(prenom) : "Re-bonjour"} 👋</h1>
    <p class="sub">${esc(email)} · <a href="#" id="autre">changer</a></p>
    <form id="f"><input type="password" id="p" required placeholder="Ton mot de passe" autocomplete="current-password">
    <button class="btn" id="b" style="width:100%">Me connecter</button></form>
    <button class="btn sec" id="c" style="width:100%;margin-top:10px">Mot de passe oublié ? Recevoir un code</button>
    <div class="msg" id="m"></div></div>`);
  document.getElementById("autre").onclick = ev => { ev.preventDefault(); login(); };
  document.getElementById("c").onclick = () => envoyerCode(email, prenom);
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault(); const b = document.getElementById("b"), m = document.getElementById("m");
    b.disabled = true; m.className = "msg"; m.textContent = "Connexion…";
    try { await post("/auth/connexion", {email, mdp: document.getElementById("p").value}); route(); }
    catch (x) { m.className = "msg err"; m.textContent = x.msg || "Réessaie."; b.disabled = false; }
  };
}

async function envoyerCode(email, prenom) {
  const m = document.getElementById("m"); if (m) { m.className = "msg"; m.textContent = "Envoi du code…"; }
  try { await post("/auth/code", {email}); }
  catch (x) { if (m) { m.className = "msg err"; m.textContent = x.msg || "Impossible d'envoyer le code."; } return; }
  page(`<div class="login card"><h1>Vérifie tes emails 📬</h1>
    <p class="sub">On vient d'envoyer un code à 6 chiffres à <b>${esc(email)}</b>. Il est valable 15 minutes (pense aux spams).</p>
    <form id="f"><input type="text" id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required placeholder="000000" class="code">
    <button class="btn" id="b" style="width:100%">Valider</button></form>
    <button class="btn sec" id="re" style="width:100%;margin-top:10px">Renvoyer un code</button>
    <div class="msg" id="m"></div></div>`);
  const c = document.getElementById("c"); c.focus();
  c.oninput = () => { if (c.value.replace(/\D/g, "").length === 6) document.getElementById("f").requestSubmit(); };
  document.getElementById("re").onclick = () => envoyerCode(email, prenom);
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault(); const b = document.getElementById("b"), m = document.getElementById("m");
    b.disabled = true; m.className = "msg"; m.textContent = "Vérification…";
    try { const r = await post("/auth/code/verifier", {email, code: c.value}); r.a_mdp ? route() : creerMdp(prenom); }
    catch (x) { m.className = "msg err"; m.textContent = x.msg || "Code incorrect."; b.disabled = false; c.select(); }
  };
}

function creerMdp(prenom) {
  page(`<div class="login card"><h1>Bienvenue${prenom ? " " + esc(prenom) : ""} 🎉</h1>
    <p class="sub">Choisis un mot de passe : la prochaine fois, tu te connectes directement, sans attendre d'email.</p>
    <form id="f"><input type="password" id="p" required minlength="8" placeholder="Au moins 8 caractères" autocomplete="new-password">
    <button class="btn" id="b" style="width:100%">Enregistrer et accéder à mes formations</button></form>
    <button type="button" class="lien-btn" id="tard">Plus tard</button>
    <div class="msg" id="m"></div></div>`);
  document.getElementById("tard").onclick = () => route();
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault(); const b = document.getElementById("b"), m = document.getElementById("m");
    b.disabled = true;
    try { await post("/auth/mot-de-passe", {mdp: document.getElementById("p").value}); proposerTelegram(); }
    catch (x) { m.className = "msg err"; m.textContent = x.msg || "Réessaie."; b.disabled = false; }
  };
}

function proposerTelegram() {
  page(`<div class="login card"><h1>Mot de passe enregistré ✅</h1>
    <p class="sub">Encore plus simple : relie ton Telegram et connecte-toi ensuite d'un seul tap, sans mot de passe.</p>
    <button class="btn tg" id="tg" type="button" style="width:100%">Relier mon Telegram</button>

async function connexionTelegram(relier) {
  const m = document.getElementById("m");
  // Fenêtre ouverte tout de suite (sinon bloquée comme pop-up), redirigée vers le bot une fois le lien reçu
  const w = window.open("about:blank", "_blank");
  let d;
  try { d = await post("/auth/telegram/demarrer", {relier}); }
  catch (x) { if (w) w.close(); m.className = "msg err"; m.textContent = x.msg || "Telegram indisponible pour le moment."; return; }
  if (w) w.location.href = d.lien; else location.href = d.lien;
  m.className = "msg"; m.innerHTML = `Telegram s'ouvre : appuie sur <b>Démarrer</b> puis <b>✅ Oui, c'est moi</b>. Cette page se met à jour toute seule.<br><a href="${esc(d.lien)}" target="_blank" rel="noopener">Telegram ne s'est pas ouvert ? Clique ici</a>`;
  stopTg();
  const debut = Date.now();
  attenteTg = setInterval(async () => {
    if (Date.now() - debut > 15 * 60000) { stopTg(); m.className = "msg err"; m.textContent = "Délai dépassé. Réessaie."; return; }
    let r; try { r = await api("/auth/telegram/etat?cle=" + encodeURIComponent(d.cle)); } catch { return; }
    if (r.etat === "attente") return;
    stopTg();
    if (r.etat === "ok") { toast(relier ? "Telegram relié ✅" : "Connecté ✅"); route(); }
    else { m.className = "msg err"; m.textContent = r.message || "Demande expirée. Réessaie."; }
  }, 2000);
}

    const nh = document.getElementById("nh"), maj = () => { if (nh && v) nh.textContent = mmss(v.currentTime); };
    if (v) v.addEventListener("timeupdate", maj);
    document.getElementById("na").onclick = async () => { const t = document.getElementById("nt").value.trim(); if (!t) return;
      const s = v ? v.currentTime : 0; const r = await post(`/espace/lecon/${l.id}/notes`, {s, texte: t});
      l.notes.push({id: r.id, secondes: s, texte: t}); l.notes.sort((a, b) => a.secondes - b.secondes); toast("Note enregistrée 📌"); ouvrir("notes"); };
    document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { if (v) { v.currentTime = +b.dataset.t; v.play(); v.scrollIntoView({behavior: "smooth", block: "center"}); } });
    document.querySelectorAll("[data-sn]").forEach(b => b.onclick = async () => { await api(`/espace/notes/${b.dataset.sn}`, {method: "DELETE"}); l.notes = l.notes.filter(n => n.id !== +b.dataset.sn); ouvrir("notes"); });
  };
  const ONGLETS = {desc: () => `<div class="desc">${l.description_html || `<p class="small">Pas de description pour cette leçon.</p>`}</div>`, notes: notesHtml, quiz: () => quizHtml(l.quiz), questions: () => questionsHtml(l)};
  const ouvrir = o => { if (!ONGLETS[o]) o = "desc"; document.querySelectorAll(".onglets a").forEach(a => a.classList.toggle("on", a.dataset.o === o)); document.getElementById("zo").innerHTML = ONGLETS[o]();
    if (o === "quiz") brancherQuiz(l, marquer); if (o === "questions") brancherQuestions(l); if (o === "notes") brancherNotes(); };
  document.querySelectorAll(".onglets a").forEach(a => a.onclick = () => ouvrir(a.dataset.o));
  ouvrir(onglet0 === "questions" ? "questions" : (l.quiz && !l.video_url ? "quiz" : (!l.description_html && l.quiz ? "quiz" : "desc")));
  if (onglet0 === "questions") document.querySelector(".onglets").scrollIntoView({behavior: "smooth"});
}

/* ── Quiz ─────────────────────────────────────────────── */
function quizHtml(z) {
  return `<div class="quiz"><h2 style="margin-top:0">${esc(z.titre)}</h2>
    <p class="small">${z.questions.length} question${z.questions.length > 1 ? "s" : ""} · ${z.seuil} % de bonnes réponses pour réussir${z.dernier ? ` · dernier essai : ${z.dernier.score} % ${z.dernier.reussi ? "✓" : ""}` : ""}</p>
    <div id="qres"></div>
    ${z.questions.map((x, i) => `<div class="qst" data-i="${i}"><h4>${i + 1}. ${esc(x.q)}</h4>${x.multiple ? `<p class="small" style="margin:-6px 0 10px">Plusieurs réponses possibles</p>` : ""}
      ${x.choix.map((c, j) => `<label><input type="${x.multiple ? "checkbox" : "radio"}" name="q${i}" value="${j}"><span>${esc(c)}</span></label>`).join("")}<div class="expl"></div></div>`).join("")}
    <button class="btn" id="qv">Valider mes réponses</button></div>`;
}
function brancherQuiz(l, marquer) {
  const z = l.quiz;
  document.getElementById("qv").onclick = async () => {
    const rep = z.questions.map((_, i) => [...document.querySelectorAll(`[name=q${i}]:checked`)].map(x => +x.value));
    if (rep.some(r => !r.length)) { document.getElementById("qres").innerHTML = `<div class="resultat ko">Réponds à toutes les questions avant de valider.</div>`; return; }
    const r = await post(`/espace/quiz/${z.id}`, {reponses: rep});
    document.getElementById("qres").innerHTML = `<div class="resultat ${r.reussi ? "ok" : "ko"}">${r.reussi ? "🎉 Bravo, quiz réussi" : "Pas encore… tu peux recommencer"} — ${r.score} % (${r.bons}/${r.total})</div>`;
    r.corrections.forEach((c, i) => { const q_ = document.querySelector(`.qst[data-i="${i}"]`);
      q_.querySelectorAll("label").forEach((lab, j) => { lab.classList.toggle("bon", c.bonnes.includes(j)); lab.classList.toggle("faux", !c.bonnes.includes(j) && lab.querySelector("input").checked); });
      q_.querySelector(".expl").textContent = (c.juste ? "✓ Juste. " : "✗ ") + (c.explication || ""); });
    const b = document.getElementById("qv"); b.textContent = "Recommencer"; b.onclick = () => lecon(l.id);
    if (r.reussi) marquer(true, true);
    document.getElementById("qres").scrollIntoView({behavior: "smooth", block: "center"});
  };
}

/* ── Questions ────────────────────────────────────────── */
const initiale = n => esc((n || "?").trim()[0] || "?").toUpperCase();
function message(x) {
  const bass = x.auteur === "admin";
  return `<div class="qq"><div class="av ${bass ? "bass" : ""}">${bass ? "B" : initiale(x.nom)}</div><div style="min-width:0;flex:1">
    <div><span class="nom">${bass ? "Bass" : esc(x.nom)}${bass ? `<span class="badge">Formateur</span>` : ""}</span> <span class="small">· ${quand(x.created_at)}</span></div>
    <div class="t">${esc(x.texte)}</div>${x.mienne && !bass ? `<button class="lien-mini" data-sup="${x.id}">Supprimer</button>` : ""}</div></div>`;
}
function questionsHtml(l) {
  return `<div class="card" style="margin-bottom:22px"><b>Une question sur cette leçon ?</b><p class="small" style="margin:4px 0 0">Bass la reçoit tout de suite et te répond ici (tu es aussi prévenu par email). Les élèves de la formation voient les questions et les réponses.</p>
    <textarea id="qt" placeholder="Écris ta question…"></textarea><button class="btn" id="qe">Envoyer ma question</button><div class="msg" id="qm"></div></div>
    ${l.questions.map(x => `<div class="fil">${message(x)}${x.reponses.map(r => `<div class="rep">${message(r)}</div>`).join("")}
      <div style="margin:10px 0 0 48px"><button class="lien-mini" data-rep="${x.id}">Répondre</button></div><div class="zr" data-z="${x.id}" hidden style="margin-left:48px">
      <textarea placeholder="Ta réponse…" style="min-height:70px"></textarea><button class="btn sec" data-env="${x.id}" style="padding:8px 14px">Envoyer</button></div></div>`).join("")
      || `<p class="small">Aucune question pour l'instant. Sois le premier à demander !</p>`}`;
}
function brancherQuestions(l) {
  const envoyer = async (texte, parent, m) => {
    try { await post(`/espace/lecon/${l.id}/questions`, {texte, parent_id: parent}); toast(l.moi.admin ? "Réponse publiée" : "Question envoyée à Bass ✓"); lecon(l.id, "questions"); }
    catch (x) { if (m) { m.className = "msg err"; m.textContent = x.msg || "Erreur, réessaie."; } }
  };
  document.getElementById("qe").onclick = () => { const t = document.getElementById("qt").value.trim(), m = document.getElementById("qm");
    if (t.length < 3) { m.className = "msg err"; m.textContent = "Écris ta question."; return; } envoyer(t, null, m); };
  document.querySelectorAll("[data-rep]").forEach(b => b.onclick = () => { const z = document.querySelector(`[data-z="${b.dataset.rep}"]`); z.hidden = !z.hidden; if (!z.hidden) z.querySelector("textarea").focus(); });
  document.querySelectorAll("[data-env]").forEach(b => b.onclick = () => { const t = b.previousElementSibling.value.trim(); if (t.length >= 2) envoyer(t, +b.dataset.env); });
  document.querySelectorAll("[data-sup]").forEach(b => b.onclick = async () => { if (confirm("Supprimer ce message ?")) { await api(`/espace/questions/${b.dataset.sup}`, {method: "DELETE"}); lecon(l.id, "questions"); } });
}

async function route() {
  const brut = location.hash.replace(/^#\/?/, ""), [h, param] = brut.split("?");
  document.getElementById("nl").classList.toggle("on", !h);
  try {
    if (h === "admin") { location.href = "/studio/"; return; }
    if (quitterLecon && !h.startsWith("l/")) { quitterLecon(); quitterLecon = null; }
    if (h !== "") stopTg();
    if (h === "notes") await mesNotes();
    else if (h === "compte") await monCompte();
    else if (h.startsWith("f/")) await formation(decodeURIComponent(h.slice(2)), param === "reprendre");
    else if (h.startsWith("l/")) await lecon(+h.slice(2), param);
    else await bibliotheque();
    connecte = true; signalerPresence();
    if (!param) window.scrollTo(0, 0);
  } catch (x) {
    if (x.auth) connecte = false;
    if (x.auth) login(new URLSearchParams(location.search).get("info") || "");
    else page(`<div class="card"><p>${esc(x.msg || "Une erreur est survenue.")}</p><a href="#/">← Retour</a></div>`);
  }
}
/* Présence : visible par Bass dans le Studio (« En ligne »), seulement quand l'onglet est au premier plan */
let connecte = false;
function signalerPresence() {
  if (!connecte || document.hidden) return;
  const h = location.hash.replace(/^#\/?/, "").split("?")[0];
  fetch(API + "/espace/presence", {method: "POST", credentials: "include", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({page: h || "accueil", lecon_id: h.startsWith("l/") ? +h.slice(2) || null : null})}).catch(() => {});
}
setInterval(signalerPresence, 30000);
document.addEventListener("visibilitychange", signalerPresence);
document.getElementById("out").onclick = async () => { await post("/auth/deconnexion").catch(() => {}); location.hash = ""; login("Tu es déconnecté."); };
addEventListener("hashchange", route);
route();
</script>
